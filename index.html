<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>동아리 지원</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <div class="top-bar">
      <div class="pill">Co;de 지원 사이트</div>
      <div class="pill small">admin</div>
    </div>

    <form>

      <label>1. 학번 / 이름을 입력하세요</label>
      <input type="text" placeholder="ex)10521 / 전은주">

      <label>2. 희망 학과를 입력하세요</label>
      <input type="text" placeholder="ex) 산업 디자인 학과">

      <label>3. 지원 동기를 서술하세요</label>
      <textarea placeholder="ex) 저는 중학교 때부터 코딩에 관심이 많았고,  
웹사이트를 직접 만들어보며 개발자의 꿈을 키워왔습니다.  
Co;de 동아리에서 다양한 프로젝트를 경험하며 실력을 키우고 싶습니다."></textarea>

      <label>4. 코딩 경험을 뽐내보세요</label>

      <div class="range-group">
        <span>언어 1개 이상 할 줄 앎</span>
        <input type="range" min="0" max="5">
      </div>

      <div class="range-group">
        <span>사이트 배포, API 등</span>
        <input type="range" min="0" max="5">
      </div>

      <div class="range-group">
        <span>AI로 코딩해봄</span>
        <input type="range" min="0" max="5">
      </div>

      <div class="range-group">
        <span>블록코딩 해봄</span>
        <input type="range" min="0" max="5">
      </div>

      <div class="range-group">
        <span>아예 모름</span>
        <input type="range" min="0" max="5">
      </div>

      <div class="bottom">
        <button type="button">면접 예상 질문 보기</button>
        <button type="submit">답변 제출</button>
      </div>

    </form>
  </div>

</body>
</html>
