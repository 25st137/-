<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Co;de 지원 사이트</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <div class="top">
    <div class="pill">Co;de 지원 사이트</div>
    <a href="admin.html" class="pill">admin</a>
  </div>

  <form id="applyForm">

    <label>1. 학번 / 이름</label>
    <input type="text" id="name" required>

    <label>2. 희망 학과</label>
    <input type="text" id="major" required>

    <label>3. 지원 동기</label>
    <textarea id="motivation" required></textarea>

    <label>4. 코딩 경험</label>

    <div class="slider-area">
      <input type="range" min="0" max="100" value="0" id="skill" class="vertical">
      <div class="slider-labels">
        <span>언어 1개 이상</span>
        <span>사이트 배포/API</span>
        <span>AI 코딩</span>
        <span>블록코딩</span>
        <span>아예 모름</span>
      </div>
    </div>

    <button type="submit">답변 제출</button>

  </form>
</div>

<div id="successOverlay">✓</div>

<script type="module" src="script.js"></script>
</body>
</html>
