<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>co;de 지원 사이트</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <header>
    <h1>co;de 지원 사이트</h1>
    <button class="top-btn">Admin</button>
  </header>

  <form id="form">

    <label>1. 이름</label>
    <input id="name" placeholder="예: 홍길동" required>

    <label>2. 지원 동기</label>
    <textarea id="motivation" placeholder="지원 동기를 구체적으로 작성하세요" required></textarea>

    <div class="slider-wrap">
      <div class="slider-label">3. 열정도</div>
      <input type="range" id="passion" min="1" max="10" value="5">
      <div class="slider-value" id="passionValue">5</div>
    </div>

    <div class="slider-wrap">
      <div class="slider-label">4. 성장 의지</div>
      <input type="range" id="growth" min="1" max="10" value="5">
      <div class="slider-value" id="growthValue">5</div>
    </div>

    <button type="submit" class="submit">답변 제출</button>

  </form>

  <table>
    <thead>
      <tr>
        <th>이름</th>
        <th>지원동기</th>
        <th>열정</th>
        <th>성장의지</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

</div>

<div id="successOverlay" class="overlay">✔</div>

<script src="script.js"></script>
</body>
</html>
